<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>radio</title>
</head>
<body>
    <div class="info">
        <h1>pocket radio!</h1>
        <p>a tiny radio that plays random songs :3</p>
        <ul>
        <li>yellow circle (right): play / pause</li>
        <li>purple circle (left): next random song</li>
        <li>songs play on their own, one after another</li>
    </ul>
    </div>
    <div class="rect">
        <div class="handle"></div>
        <div class="box"><span class="title"></span></div>
        <div class="circle1" id="play">
            <div class="circle3"></div>
        </div>
        <div class="circle2" id="next">
            <div class="circle4"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
